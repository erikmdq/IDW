<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinarios - Veterinaria Mi Mascota</title>
    <!-- Framework Bootstrap 5 para estilos básicos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="sticky-top bg-body-tertiary shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="./assets/images/cat-dog.jpg" alt="Logo Veterinaria" width="45" height="45" class="rounded-circle border border-light">
                    <div>
                        <span class="fw-bold d-block lh-1">Veterinaria Mi Mascota</span>
                        <small class="fs-7 text-muted fw-normal">Atención las 24 hs</small>
                    </div>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto fs-5">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="institucional.html">Institucional</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="veterinarios.html">Veterinarios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="mascotas.html">Mascotas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="container my-4">
        <h2 class="mb-4 text-center">Gestión de Veterinarios</h2>



        <div class="row">

            <!-- Formulario de Registro -->
            <div class="col-md-4 mb-4">
                <div class="card p-3 shadow-sm">
                    <h4 id="titulo-form">Agregar Veterinario</h4>
                    
                    <form id="form-veterinario">
                        <!-- Campo oculto: vale -1 si es nuevo, o el número de índice si editamos -->
                        <input type="hidden" id="posicion-editar" value="-1">

                        <div class="mb-3">
                            <label for="matricula" class="form-label">Matrícula:</label>
                            <input type="number" class="form-control" id="matricula" required>
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo:</label>
                            <input type="text" class="form-control" id="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="especializacion" class="form-label">Especialización:</label>
                            <select class="form-select" id="especializacion" required>
                                <option value="">Seleccione una opción...</option>
                                <option value="Consulta general">Consulta general</option>
                                <option value="Clínica General">Clínica General</option>
                                <option value="Cirugía">Cirugía</option>
                                <option value="Dermatología">Dermatología</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="valorConsulta" class="form-label">Valor Consulta ($):</label>
                            <input type="number" class="form-control" id="valorConsulta" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100" id="btn-guardar">Guardar</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2 d-none" id="btn-cancelar">Cancelar</button>
                    </form>
                </div>
            </div>




            <!-- Tabla de Datos -->
            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h4>Listado de Veterinarios</h4>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mt-3">
                            <thead class="table-dark">
                                <tr>
                                    <th>Matrícula</th>
                                    <th>Nombre</th>
                                    <th>Especialización</th>
                                    <th>Consulta</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-body">
                                <!-- Se llena dinámicamente desde JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <!-- Script para administrar la lista de veterinarios -->
    <script src="./veterinarios.js"></script>
</body>
</html>
